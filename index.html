<title>你的一天 · 短肠综合征互动科普</title>
<meta name="description" content="扮演一位短肠综合征病友，从早到晚完成 9 个真实决策，看见「吃饭、喝水、上厕所」这些小事在另一种人生里的复杂度。" data-page-node-id="6AQJlHKZfp11kndAYCSyWe">

<style>
:root{
  --paper:#FAF7F2;
  --card:#FFFFFF;
  --ink:#22201D;
  --ink2:#5E5951;
  --ink3:#958F84;
  --line:#E8E1D5;
  --line2:#F1EBE0;
  --teal:#17635F;
  --teal-2:#2A8380;
  --teal-soft:#E6F1EE;
  --amber:#B97A28;
  --amber-soft:#FBEFDC;
  --rose:#AC4F3F;
  --rose-soft:#F8E8E3;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:16px;
  --shadow:0 1px 2px rgba(34,32,29,.04),0 8px 24px -12px rgba(34,32,29,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -8%,#E9F2EF 0%,rgba(233,242,239,0) 62%),
    radial-gradient(760px 520px at 92% 2%,#FBF0E0 0%,rgba(251,240,224,0) 58%);
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ============ HUD ============ */
.hud{
  position:sticky;top:0;z-index:50;
  background:rgba(250,247,242,.86);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line2);
  transition:opacity .35s,transform .35s;
}
.hud.hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
.hud-inner{
  max-width:880px;margin:0 auto;padding:11px 22px;
  display:flex;align-items:center;gap:22px;
}
.clock{display:flex;flex-direction:column;line-height:1.15;min-width:74px}
.clock b{
  font-family:var(--serif);font-size:23px;font-weight:600;
  letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--ink);
}
.clock small{font-size:10.5px;color:var(--ink3);letter-spacing:.09em;margin-top:2px}
.stats{display:flex;gap:15px;flex:1}
.stat{flex:1;min-width:0}
.s-label{
  display:block;font-size:10px;color:var(--ink3);letter-spacing:.11em;
  margin-bottom:5px;white-space:nowrap;
}
.bar{height:4px;border-radius:99px;background:#EDE7DC;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.22,.9,.24,1)}
#barH{background:linear-gradient(90deg,#3E918C,#17635F)}
#barE{background:linear-gradient(90deg,#DDA75A,#B97A28)}
#barC{background:linear-gradient(90deg,#D0887A,#AC4F3F)}
.cost{
  flex:0 0 auto;padding-left:16px;border-left:1px solid var(--line);
}
.c-label{
  display:block;font-size:10px;color:var(--ink3);letter-spacing:.11em;
  margin-bottom:5px;white-space:nowrap;
}
.c-val{display:block;line-height:1;white-space:nowrap}
.c-val b{
  font-family:var(--serif);font-size:18px;color:var(--rose);
  font-variant-numeric:tabular-nums;font-weight:600;
}
.c-val b.bump{animation:bump .5s ease}
.c-val i{font-style:normal;font-size:10px;color:var(--ink3);margin-left:2px}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.track{height:2px;background:var(--line2);position:relative;overflow:hidden}
.track-fill{height:100%;width:0;background:linear-gradient(90deg,#3E918C,#17635F);transition:width .8s cubic-bezier(.22,.9,.24,1)}

/* ============ STAGE ============ */
main{
  flex:1;width:100%;max-width:880px;margin:0 auto;
  padding:44px 22px 120px;
  display:flex;flex-direction:column;
}
.screen{animation:rise .55s cubic-bezier(.2,.75,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ COVER ============ */
.cover{max-width:660px;margin:auto;text-align:center;padding-top:0}
.cover .kicker{
  display:inline-block;font-size:10.5px;letter-spacing:.34em;color:var(--teal);
  border:1px solid #CFE0DC;background:var(--teal-soft);
  padding:5px 14px 5px 16px;border-radius:99px;margin-bottom:30px;
}
.cover h1{
  font-family:var(--serif);font-size:clamp(38px,7.2vw,60px);
  font-weight:600;line-height:1.16;margin:0 0 6px;letter-spacing:.01em;
}
.cover h1 em{font-style:normal;color:var(--teal);position:relative;white-space:nowrap}
.cover h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:.07em;height:.34em;
  background:linear-gradient(90deg,rgba(42,131,128,.16),rgba(42,131,128,.07));
  border-radius:2px;z-index:-1;
}
.cover .sub{
  font-family:var(--serif);font-size:clamp(15px,2.6vw,18px);
  color:var(--ink2);margin:14px 0 0;letter-spacing:.04em;
}
.cover .desc{
  font-size:14.5px;color:var(--ink2);max-width:470px;
  margin:24px auto 0;line-height:1.95;text-align:left;
}
.cover .desc strong{color:var(--ink);font-weight:600}
.wave{margin:26px auto 0;display:block;width:min(100%,420px);height:40px;opacity:.85}
.enter{
  margin-top:36px;display:inline-flex;align-items:center;gap:10px;
  background:var(--teal);color:#fff;border:0;border-radius:99px;
  padding:15px 34px;font-size:15px;font-family:var(--sans);
  cursor:pointer;letter-spacing:.06em;transition:.25s;box-shadow:0 10px 26px -12px rgba(23,99,95,.75);
}
.enter:hover{background:#125451;transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(23,99,95,.85)}
.enter:active{transform:translateY(0) scale(.985)}
.enter svg{width:15px;height:15px}
.cover .meta{
  margin-top:26px;font-size:11.5px;color:var(--ink3);letter-spacing:.06em;
}
.cover .meta span{margin:0 7px}

/* ============ SCENE ============ */
.scene{max-width:700px;margin:0 auto}
.scene-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.time-chip{
  font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.06em;
  color:var(--teal);background:var(--teal-soft);border-radius:99px;
  padding:5px 13px;font-variant-numeric:tabular-nums;
}
.tag{
  font-size:10.5px;letter-spacing:.2em;color:var(--ink3);
  padding:5px 0;
}
.tag::before{content:"";display:inline-block;width:14px;height:1px;background:var(--ink3);vertical-align:middle;margin-right:8px;opacity:.5}
.scene h1{
  font-family:var(--serif);font-size:clamp(25px,4.4vw,33px);
  font-weight:600;line-height:1.35;margin:0 0 16px;letter-spacing:.01em;
}
.lead{font-size:15px;color:var(--ink2);line-height:1.95;margin:0 0 20px}
.lead strong{color:var(--ink);font-weight:600;background:linear-gradient(transparent 62%,#FBEFDC 62%)}
.status{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px}
.status span{
  font-size:11.5px;color:var(--ink2);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  font-variant-numeric:tabular-nums;
}
.status span::before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--teal-2);margin-right:6px;vertical-align:middle;opacity:.75;
}
.ask{
  font-size:13px;color:var(--ink3);letter-spacing:.05em;
  margin:0 0 12px;display:flex;align-items:center;gap:8px;
}
.ask::after{content:"";flex:1;height:1px;background:var(--line2)}

/* ============ CHOICES ============ */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;font-family:var(--sans);color:var(--ink);
  transition:.2s;position:relative;
}
.choice:hover:not(:disabled){border-color:#CFC6B6;transform:translateY(-1px);box-shadow:var(--shadow)}
.choice:disabled{cursor:default}
.choice .ct{display:block;font-size:14.5px;font-weight:500;line-height:1.55}
.choice .cs{display:block;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5}
.choice.picked{border-color:var(--teal);background:var(--teal-soft)}
.choice.picked.ok{border-color:#4E9E86;background:#EAF5EF}
.choice.picked.bad{border-color:#C97F6E;background:var(--rose-soft)}
.choice.picked.soft{border-color:#DCAF6F;background:var(--amber-soft)}
.choice.reveal{border-color:#4E9E86;border-style:dashed;background:#F4FAF7}
.choice.dim{opacity:.45}

/* ============ MULTI ============ */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick{
  cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:13px 14px;text-align:left;font-family:var(--sans);
  color:var(--ink);transition:.18s;position:relative;
}
.pick:hover:not(:disabled){border-color:#CFC6B6}
.pick .pn{display:block;font-size:13.5px;font-weight:500;line-height:1.45}
.pick .pd{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.pick .mark{
  position:absolute;top:9px;right:10px;width:15px;height:15px;border-radius:50%;
  border:1.5px solid var(--line);transition:.18s;
}
.pick.on{border-color:var(--teal);background:var(--teal-soft)}
.pick.on:hover{border-color:var(--teal)}
.pick.on .mark{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px #fff}
.pick:disabled{cursor:default}
.pick.right{border-color:#4E9E86;background:#EAF5EF}
.pick.wrong{border-color:#C97F6E;background:var(--rose-soft);opacity:.85}

/* ============ SLIDER ============ */
.slider-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.slider-val{
  font-family:var(--serif);font-size:40px;font-weight:600;color:var(--teal);
  text-align:center;line-height:1;font-variant-numeric:tabular-nums;
}
.slider-val small{font-size:14px;color:var(--ink3);margin-left:3px;font-family:var(--sans)}
.slider-hint{text-align:center;font-size:12px;color:var(--ink3);margin-top:7px;min-height:19px;transition:.2s}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;
  background:linear-gradient(90deg,var(--teal-soft),#DDD5C7);outline:none;margin:24px 0 8px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:2px solid var(--teal);cursor:grab;
  box-shadow:0 2px 8px rgba(23,99,95,.28);transition:.15s;
}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:#fff;
  border:2px solid var(--teal);cursor:grab;box-shadow:0 2px 8px rgba(23,99,95,.28);
}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:0 2px}

/* ============ SEQUENCE ============ */
.seq{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.seq-item{
  cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;text-align:left;font-family:var(--sans);color:var(--ink);
  font-size:13.5px;line-height:1.55;transition:.18s;display:flex;gap:11px;align-items:flex-start;
}
.seq-item:hover:not(:disabled){border-color:#CFC6B6}
.seq-item .num{
  flex:0 0 21px;height:21px;border-radius:50%;background:#F2EDE4;color:var(--ink3);
  font-size:11px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;transition:.2s;margin-top:1px;
}
.seq-item.on{border-color:var(--teal);background:var(--teal-soft)}
.seq-item.on:hover{border-color:var(--teal)}
.seq-item.on .num{background:var(--teal);color:#fff}
.seq-item:disabled{cursor:default}
.seq-item.rt{border-color:#4E9E86;background:#EAF5EF}
.seq-item.rw{border-color:#C97F6E;background:var(--rose-soft)}

/* ============ FORMULA ============ */
.formula{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 20px 20px}
.fgroup{padding:16px 0;border-bottom:1px solid var(--line2)}
.fgroup:last-of-type{border-bottom:0;padding-bottom:6px}
.fq{font-size:13.5px;color:var(--ink);margin-bottom:11px;font-weight:500}
.fq span{color:var(--ink3);font-weight:400;font-size:12px;margin-left:6px}
.fopts{display:flex;gap:8px;flex-wrap:wrap}
.fopt{
  cursor:pointer;border:1px solid var(--line);background:#FCFAF6;border-radius:99px;
  padding:8px 16px;font-size:12.5px;font-family:var(--sans);color:var(--ink2);transition:.18s;
}
.fopt:hover:not(:disabled){border-color:#CFC6B6;color:var(--ink)}
.fopt.on{border-color:var(--teal);background:var(--teal);color:#fff}
.fopt.on:hover{color:#fff;border-color:var(--teal)}
.fopt.on.wrong{background:var(--rose);border-color:var(--rose)}
.fopt.on.wrong:hover{background:var(--rose);border-color:var(--rose)}
.fopt.reveal{border-color:#4E9E86;border-style:dashed;color:#2E7A63}
.fopt:disabled{cursor:default}

/* ============ SUBMIT ============ */
.submit{
  margin-top:18px;width:100%;padding:14px;border-radius:12px;border:0;
  background:var(--teal);color:#fff;font-family:var(--sans);font-size:14.5px;
  cursor:pointer;letter-spacing:.06em;transition:.22s;
  box-shadow:0 8px 20px -12px rgba(23,99,95,.7);
}
.submit:hover:not(:disabled){background:#125451}
.submit:disabled{background:#EBE4D8;color:#8B8173;cursor:not-allowed;box-shadow:none}

/* ============ FEEDBACK ============ */
.feedback{margin-top:26px;scroll-margin-top:82px}
.fb{animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.verdict{display:flex;gap:13px;align-items:flex-start;border-radius:13px;padding:16px 18px;margin-bottom:18px}
.verdict.good{background:#EAF5EF;border:1px solid #C6E2D4}
.verdict.mid{background:var(--amber-soft);border:1px solid #EFD9B4}
.verdict.bad{background:var(--rose-soft);border:1px solid #EBCFC7}
.v-icon{
  flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px;
}
.good .v-icon{background:#3E8C72}
.mid .v-icon{background:var(--amber)}
.bad .v-icon{background:var(--rose)}
.verdict .vt{font-size:14px;font-weight:600;margin:0 0 5px;line-height:1.5}
.verdict .vx{font-size:13.5px;color:var(--ink2);margin:0;line-height:1.85}
.verdict .vx strong{color:var(--ink);font-weight:600}

.compare{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);
}
.cmp{padding:17px 18px}
.cmp.normal{background:#F6F2EA;border-right:1px solid var(--line)}
.cmp.patient{background:#FBFDFC}
.cmp-head{
  display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;
  margin-bottom:10px;font-weight:600;
}
.cmp.normal .cmp-head{color:var(--ink3)}
.cmp.patient .cmp-head{color:var(--teal)}
.cmp-head .dot{width:7px;height:7px;border-radius:50%}
.cmp.normal .dot{background:#C4BCAE}
.cmp.patient .dot{background:var(--teal)}
.cmp p{font-size:13px;line-height:1.85;margin:0;color:var(--ink2)}
.cmp.patient p{color:#3C3A36}
.cmp .dur{
  display:inline-block;margin-top:11px;font-size:11px;letter-spacing:.05em;
  font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:6px;
}
.cmp.normal .dur{background:#EDE7DC;color:#8A8377}
.cmp.patient .dur{background:var(--teal-soft);color:var(--teal)}

.fact{
  margin-top:16px;padding:14px 16px 14px 18px;border-left:2px solid #D9CFBD;
  background:rgba(255,255,255,.6);border-radius:0 10px 10px 0;
  font-size:12.5px;color:var(--ink2);line-height:1.85;
}
.fact b{color:var(--ink);font-weight:600;letter-spacing:.05em}

.next{
  margin-top:24px;width:100%;padding:15px;border-radius:12px;
  background:var(--teal);color:#fff;border:0;font-family:var(--sans);
  font-size:14.5px;letter-spacing:.09em;cursor:pointer;transition:.22s;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 24px -14px rgba(23,99,95,.8);
}
.next:hover{background:#125451;letter-spacing:.13em;box-shadow:0 14px 28px -14px rgba(23,99,95,.9)}
.next svg{width:15px;height:15px;transition:transform .22s}
.next:hover svg{transform:translateX(4px)}

/* ============ ENDING ============ */
.end{max-width:760px;margin:0 auto}
.end .kicker{
  font-size:10.5px;letter-spacing:.34em;color:var(--teal);
  border:1px solid #CFE0DC;background:var(--teal-soft);
  display:inline-block;padding:5px 14px 5px 16px;border-radius:99px;margin-bottom:24px;
}
.end h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:600;line-height:1.3;margin:0 0 14px}
.end .sub{font-size:14.5px;color:var(--ink2);line-height:1.95;margin:0 0 32px;max-width:600px}

.bill{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:28px 30px;display:flex;gap:34px;align-items:center;
  box-shadow:var(--shadow);margin-bottom:36px;flex-wrap:wrap;
}
.bill-main{flex:1;min-width:180px}
.bill-main .num{
  font-family:var(--serif);font-size:clamp(52px,9vw,74px);font-weight:600;
  color:var(--rose);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.bill-main .num small{font-size:19px;margin-left:4px;color:var(--ink2);font-family:var(--sans)}
.bill-main .lbl{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.7}
.bill-side{flex:0 0 auto;border-left:1px solid var(--line2);padding-left:32px}
.bill-side .row{font-size:12.5px;color:var(--ink2);margin:7px 0;line-height:1.6}
.bill-side .row b{font-family:var(--serif);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}

.sec-h{
  font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 6px;
  display:flex;align-items:center;gap:11px;
}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-note{font-size:12px;color:var(--ink3);margin:0 0 16px}

table.cmp-table{
  width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  margin-bottom:40px;font-size:13px;
}
table.cmp-table th,table.cmp-table td{padding:13px 16px;text-align:left;vertical-align:top;line-height:1.65}
table.cmp-table thead th{
  font-size:10.5px;letter-spacing:.16em;color:var(--ink3);font-weight:600;
  border-bottom:1px solid var(--line);background:#FBF8F3;padding-top:15px;padding-bottom:13px;
}
table.cmp-table thead th:nth-child(3){color:var(--teal)}
table.cmp-table thead th:nth-child(1){width:19%}
table.cmp-table thead th:nth-child(2){width:37%}
table.cmp-table thead th:nth-child(3){width:44%}

<script>
(function(){
'use strict';

var stage = document.getElementById('stage');
var hud = document.getElementById('hud');

var S = {
  idx: 0,
  h: 75, e: 68, c: 72,
  mins: 0, normalMins: 0,
  hits: 0, decisions: 0
};

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function paintHUD(){
  document.getElementById('barH').style.width = Math.max(4, Math.min(100, S.h)) + '%';
  document.getElementById('barE').style.width = Math.max(4, Math.min(100, S.e)) + '%';
  document.getElementById('barC').style.width = Math.max(4, Math.min(100, S.c)) + '%';
  var cEl = document.getElementById('cost');
  if (cEl.textContent !== String(S.mins)) {
    cEl.textContent = S.mins;
    cEl.classList.remove('bump');
    void cEl.offsetWidth;
    cEl.classList.add('bump');
  }
  var sc = SCENES[S.idx];
  document.getElementById('clock').textContent = sc ? sc.time : '23:59';
  document.getElementById('stepLbl').textContent = Math.min(S.idx + 1, SCENES.length) + ' / ' + SCENES.length;
  document.getElementById('trackFill').style.width = Math.min(100, (S.idx + 1) / SCENES.length * 100) + '%';
}

function applyFx(fx){
  if (!fx) return;
  S.h = Math.max(0, Math.min(100, S.h + (fx.h || 0)));
  S.e = Math.max(0, Math.min(100, S.e + (fx.e || 0)));
  S.c = Math.max(0, Math.min(100, S.c + (fx.c || 0)));
  S.mins += (fx.m || 0);
  S.normalMins += (fx.nm || 0);
  paintHUD();
}

/* ---------- feedback ---------- */
function resolve(root, fb){
  if (root) {
    root.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
  }
  S.decisions++;
  if (fb.ok) S.hits++;
  applyFx(fb.fx);

  var fbBox = document.getElementById('feedback');
  var cls = fb.ok ? 'good' : (fb.soft ? 'mid' : 'bad');
  var glyph = fb.ok ? '✓' : (fb.soft ? '!' : '×');

  fbBox.innerHTML =
    '<div class="fb">' +
      '<div class="verdict ' + cls + '">' +
        '<div class="v-icon">' + glyph + '</div>' +
        '<div>' +
          '<p class="vt">' + fb.title + '</p>' +
          '<p class="vx">' + fb.text + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="compare">' +
        '<div class="cmp normal">' +
          '<div class="cmp-head"><span class="dot"></span>普通人</div>' +
          '<p>' + fb.normal + '</p>' +
          (fb.nm != null ? '<span class="dur">' + fb.nm + '</span>' : '') +
        '</div>' +
        '<div class="cmp patient">' +
          '<div class="cmp-head"><span class="dot"></span>你</div>' +
          '<p>' + fb.you + '</p>' +
          (fb.ym != null ? '<span class="dur">' + fb.ym + '</span>' : '') +
        '</div>' +
      '</div>' +
      (fb.fact ? '<div class="fact"><b>事实核查</b>　' + fb.fact + '</div>' : '') +
      '<button class="next" id="nextBtn">继续 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>' +
    '</div>';

  document.getElementById('nextBtn').onclick = next;
  setTimeout(function(){
    fbBox.scrollIntoView({behavior:'smooth', block:'start'});
  }, 90);
}

function next(){
  S.idx++;
  if (S.idx >= SCENES.length) { ending(); return; }
  render();
}

/* ---------- render ---------- */
function render(){
  var sc = SCENES[S.idx];
  paintHUD();
  stage.innerHTML =
    '<article class="scene screen">' +
      '<div class="scene-head"><span class="time-chip">' + sc.time + '</span><span class="tag">' + sc.tag + '</span></div>' +
      '<h1>' + sc.title + '</h1>' +
      '<p class="lead">' + sc.lead + '</p>' +
      (sc.status ? '<div class="status">' + sc.status.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>' : '') +
      '<p class="ask">' + (sc.ask || '你会怎么做') + '</p>' +
      '<div id="interact"></div>' +
      '<div class="feedback" id="feedback"></div>' +
    '</article>';
  sc.build(document.getElementById('interact'));
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- interaction builders ---------- */
function choiceBlock(root, opts, after){
  root.innerHTML = '<div class="choices">' + opts.map(function(o, i){
    return '<button class="choice" data-i="' + i + '">' +
             '<span class="ct">' + o.t + '</span>' +
             (o.s ? '<span class="cs">' + o.s + '</span>' : '') +
           '</button>';
  }).join('') + '</div>';

  var btns = root.querySelectorAll('.choice');
  btns.forEach(function(b){
    b.onclick = function(){
      var i = +b.dataset.i;
      var o = opts[i];
      btns.forEach(function(x){ x.disabled = true; x.classList.add('dim'); });
      b.classList.remove('dim');
      b.classList.add('picked', o.ok ? 'ok' : (o.soft ? 'soft' : 'bad'));
      if (!o.ok) {
        var corrected = opts.findIndex(function(x){ return x.ok; });
        if (corrected > -1) { btns[corrected].classList.remove('dim'); btns[corrected].classList.add('reveal'); }
      }
      after(o);
    };
  });
}

/* ---------- boot ---------- */
function cover(){
  stage.innerHTML =
    '<section class="cover screen">' +
      '<span class="kicker">互动科普</span>' +
      '<h1>如果今天，<br>你是<em>短肠综合征</em>病友</h1>' +

      '<button class="enter" id="startBtn">开始这一天' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>' +
      '</button>' +
      '<p class="meta"><span>约 6 分钟</span>·<span>9 个决策</span>·<span>无医学背景要求</span></p>' +
    '</section>';
  document.getElementById('startBtn').onclick = function(){
    hud.classList.remove('hidden');
    S.idx = 0;
    render();
  };
}

var SCENES = [];
SCENES.push({

  lead: '天刚亮，你是被肚子里的声音叫醒的。床头柜上摆着三样东西：一台电子体重秤、一个带刻度的量杯、一部手机。<strong>昨晚你起了三次夜</strong>，最后一次在凌晨四点。',
  status: ['术后 14 个月', '剩余小肠 45 cm', '中心静脉导管在位', '今日排便 0 次'],
  ask: '清醒之后，第一件事做什么',
  build: function(root){

          normal:'上厕所，按冲水，刷牙。三十秒。一辈子重复两万多次，从没记过一次尿量。',
          nm:'30 秒',
          you:'量尿量、称体重、记数字、和昨天比对、决定要不要调整补液。做完这些，你还没洗脸。',
          ym:'6 分钟',

          normal:'同上——从来不需要记。',

          fact:'出入量记录是短肠病友家庭管理的核心工具，也是医生调整肠内/肠外营养配方的唯一客观依据。',

    var picked = [-1, -1, -1];

    root.innerHTML =
      '<div class="formula">' + groups.map(function(g, gi){
        return '<div class="fgroup"><div class="fq">' + g.q + (g.note ? '<span>' + g.note + '</span>' : '') + '</div>' +
          '<div class="fopts">' + g.opts.map(function(op, oi){
            return '<button class="fopt" data-g="' + gi + '" data-o="' + oi + '">' + op + '</button>';
          }).join('') + '</div></div>';
      }).join('') + '</div>' +
      '<button class="submit" id="sub" disabled>再选 ' + 3 + ' 项</button>';

    var opts = root.querySelectorAll('.fopt');
    var sub = document.getElementById('sub');

    function refresh(){
      var done = picked.filter(function(x){ return x > -1; }).length;
      sub.disabled = done !== 3;
      sub.textContent = done === 3 ? '冲好，喝下去' : '还差 ' + (3 - done) + ' 项';
    }

    opts.forEach(function(b){
      b.onclick = function(){
        var gi = +b.dataset.g, oi = +b.dataset.o;
        root.querySelectorAll('.fopt[data-g="' + gi + '"]').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        picked[gi] = oi;
        refresh();
      };
    });

    sub.onclick = function(){
      opts.forEach(function(b){
        b.disabled = true;
        var gi = +b.dataset.g, oi = +b.dataset.o;

      var allOk = picked.every(function(v, i){ return v === groups[i].ans; });
      resolve(root, {
        ok: allOk,
        title: allOk ? '配比对了。这一步不能凭感觉' : '按「感觉」配的补液盐，可能越喝越糟',
        text: allOk
          ? '一袋兑 250 ml 温水，不加糖、不加盐、不加蜂蜜。口服补液盐的价值全在<strong>比例</strong>上——钠和葡萄糖的浓度是算好的，靠协同转运把水吸进体内。糖多了，渗透压升高，反而把水拉进肠腔；盐多了，更渴、也更拉。<br><br>喝完 200–300 ml，坐下休息。然后：记录这次丢失量、检查肛周或造口周围皮肤、补一片锌。'
          : '正确配法是：<strong>一袋兑 250 ml 温水，什么都不加</strong>。自行加糖会抬高渗透压，等于给腹泻加了一把劲；加盐会加剧口渴与钠负荷；蜂蜜本质还是糖。冰水刺激蠕动，刚烧开的水会破坏配方稳定性。<br><br>这不是「差不多就行」的事——你依赖它活着。',
        normal:'拉肚子：喝点热水，睡一觉，明天就好了。',
        nm:'0 分钟',
        you:'配比精确到毫升、补 300 ml、记录丢失量、检查皮肤、补锌，然后把下午剩下的工作挪到明天。',
        ym:'15 分钟',
        fact:'ORS 的疗效取决于钠-葡萄糖配比。自行加糖或加盐会破坏渗透压设计、加重腹泻。短肠病友腹泻发作时还应注意锌与碳酸氢盐丢失，以及肛周/造口周围皮肤的屏障损伤。',
        fx: allOk ? { h:12, e:-2, c:6, m:15 } : { h:-4, c:-8, m:18 }
      });
    };
  }
});

  var mins = S.mins;
  var hours = (mins / 60).toFixed(1);

  var rows = [
    ['喝水', '端起杯子就喝。一天 6–8 次，从不需要想。', '计量、分次、配比。一天 12–15 次，每次都要判断「这口喝什么」。'],

        '<div class="bill-main">' +

cover();

})();
